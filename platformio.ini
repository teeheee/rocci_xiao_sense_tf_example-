; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 921600
upload_speed = 921600

; Enable PSRAM
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; Flash configuration
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Partition layout
board_build.partitions = default_8MB.csv

; Build options
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Compatibility for the pinned Arduino TFLite Micro library on current ESP32 toolchains.
    -DportTICK_RATE_MS=portTICK_PERIOD_MS
    -Wno-error=implicit-function-declaration
    -Wno-error=template-body

lib_deps =
    https://github.com/teeheee/rocci_xiao_sense_library.git#v0.3.0
    https://github.com/tanakamasayuki/Arduino_TensorFlowLite_ESP32.git#1.0.0
